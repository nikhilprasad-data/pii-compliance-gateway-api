version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: pii_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: pii_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_cache:
    image: redis:7-alpine
    container_name: pii_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: