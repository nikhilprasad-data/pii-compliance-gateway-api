services:
  backend_api:
    build: .
    container_name: pii_backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=${APP_NAME}
      - APP_VERSION=${APP_VERSION}
      - API_V1_STR=${API_V1_STR}
      - DEBUG=${DEBUG}

      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}

      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=postgres_db
      - DB_PORT=5432

      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}

      - ALGORITHM=${ALGORITHM}
      - JWT_TOKEN_EXPIRATION_TIME_MINUTES=${JWT_TOKEN_EXPIRATION_TIME_MINUTES}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}

      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - postgres_db
      - redis_cache

  postgres_db:
    image: postgres:15-alpine
    container_name: pii_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_cache:
    image: redis:7-alpine
    container_name: pii_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
