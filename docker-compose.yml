services:
  postgres_db:
    image: postgres:15-alpine
    container_name: pii_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_cache:
    image: redis:7-alpine
    container_name: pii_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: